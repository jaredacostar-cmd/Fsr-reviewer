name: Weekly data snapshot

on:
  schedule:
    # Mondays 10:17 UTC (6:17 am Toronto in summer, 5:17 am in winter)
    - cron: '17 10 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      - name: Build snapshot
        run: node scripts/build-snapshot.js --out data

      - name: Commit if changed
        run: |
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json data/history.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Weekly data snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
