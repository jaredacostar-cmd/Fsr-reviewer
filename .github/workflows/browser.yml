name: Browser tests

# The click-paths in tests/browser/run.js (first run, Check a site, the full table, Start over,
# page ↔ map, the keyboard, the phone), in Chromium, on every pull request and on main.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The paths in two halves side by side (SHARD=i/n in tests/browser/run.js: every second path), so a
  # run takes about half as long; the check named "browser" below passes when both halves do.
  paths:
    name: browser paths (${{ matrix.shard }} of 2)
    # (24.04, not ubuntu-latest: playwright 1.56.1 installs no Chromium on Ubuntu 26.04)
    runs-on: ubuntu-24.04
    # (the paths take about 55 s each on this runner: 39 paths came to 37 minutes in one job)
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        if: matrix.shard == 1
        run: npm test

      - name: Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      # (the map libraries the app loads from unpkg, served from the npm registry's copies: unpkg's
      # stalls left page loads hanging until the paths timed out, 2026-10-27)
      - name: Map libraries from the npm registry
        run: node tests/browser/cdn.js "$RUNNER_TEMP/cdn"

      - name: Browser paths
        env:
          SHARD: ${{ matrix.shard }}/2
          CDN_DIR: ${{ runner.temp }}/cdn
        run: npm run browser

  browser:
    needs: paths
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Both halves of the paths passed
        run: test "${{ needs.paths.result }}" = success
