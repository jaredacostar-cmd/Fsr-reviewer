name: Update data and deploy site

# Push to main: redeploy the site.
# Monday schedule / manual run: refresh the data snapshot, commit it, then redeploy.
# (Both live in one workflow because a commit pushed with GITHUB_TOKEN does not
# trigger other workflows.)
on:
  push:
    branches: [main]
  schedule:
    # Mondays 10:17 UTC (6:17 am Toronto in summer, 5:17 am in winter)
    - cron: '17 10 * * 1'
  workflow_dispatch: {}

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      - name: Build snapshot
        run: node scripts/build-snapshot.js --out data

      - name: Commit if changed
        run: |
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json data/history.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Weekly data snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy:
    needs: snapshot
    # Deploy even if the snapshot was skipped (push) or failed (the site still works live).
    if: always() && needs.snapshot.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch tip, so a snapshot committed by the job above is included.
          ref: ${{ github.ref_name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
