name: Update data and deploy site

# Push to main: redeploy the site.
# Monday schedule / manual run: refresh the data snapshot, commit it, then redeploy.
# (Both live in one workflow because a commit pushed with GITHUB_TOKEN does not
# trigger other workflows.)
on:
  push:
    branches: [main]
  schedule:
    # Mondays 10:17 UTC (6:17 am Toronto in summer, 5:17 am in winter)
    - cron: '17 10 * * 1'
  workflow_dispatch:
    inputs:
      accept_data:
        description: "Publish this week's data even though it moved more than usual (after a look at the review issue); failing tests still hold it"
        type: boolean
        default: false

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  snapshot:
    # Weekly data is committed to main only (a manual run from another branch does nothing).
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write   # the review issue when this week's data is held
    # Shared with the Probe data sources workflow, which commits data to the branch it runs on:
    # one data commit at a time per branch.
    concurrency:
      group: data-commit-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # (tests pinned to one real site follow the data: reported, not fatal, tests/helpers/site-check.js)
      - name: Unit tests
        env:
          SITE_CHECKS: warn
        run: npm test

      - name: Build snapshot
        run: node scripts/build-snapshot.js --out data

      # Secondary plans, MTSAs and the 2021 Census baseline change rarely; a failure keeps
      # last week's file.
      - name: Build areas and census baseline
        continue-on-error: true
        run: node scripts/build-areas.js --out data

      # Council and committee items naming application files (eSCRIBE). A failure keeps last
      # week's file.
      - name: Council and committee items
        continue-on-error: true
        timeout-minutes: 40
        run: node scripts/build-council.js --out data

      # The latest functional servicing report on each application's page (Mississauga, Caledon).
      # A failure keeps last week's file.
      - name: Functional servicing reports
        continue-on-error: true
        timeout-minutes: 30
        run: node scripts/build-fsr.js --out data

      # Steps B1–B2: the trees as the developments and their counts (js/tree-groups.js,
      # js/tree-counts.js).
      # A failure keeps last week's file; the app then keeps the previous count for any
      # development whose files changed.
      - name: Tree counts
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/build-tree-counts.js --out data

      # Region capital projects (construction progress) and environmental assessments (status, next
      # steps, report decisions, links to the capital projects). Each refuses to write when it reads
      # much less than last week; a failure keeps last week's files.
      - name: Capital projects
        continue-on-error: true
        timeout-minutes: 20
        run: |
          node scripts/build-capital.js --out data
          # Rebuilt data that fails its checks is not committed (the last good file stays).
          node --test tests/capital-ea-ui.test.js > /tmp/cap-test.log 2>&1 || { grep -A30 '^not ok' /tmp/cap-test.log | head -80; git checkout -- data/capital.json data/capital-links-audit.json; echo "::warning::capital.json rebuild failed its checks; kept the previous file"; }
      - name: Environmental assessments
        continue-on-error: true
        timeout-minutes: 40
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          node scripts/build-eas.js --out data --capital data/capital.json
          node --test tests/ea-data.test.js tests/ea-tab.test.js tests/capital-ea-ui.test.js > /tmp/eas-test.log 2>&1 || { grep -A30 '^not ok' /tmp/eas-test.log | head -80; git checkout -- data/eas.json data/eas-review.csv; echo "::warning::eas.json rebuild failed its checks; kept the previous files"; }

      # Region of Peel address points (open data, about 504,000 points, 1 minute) matched to every
      # file's address (data/address-points.json): the duplicate check and a file's address line.
      # The build refuses to write when it matches far fewer addresses than last week.
      - name: Address points
        continue-on-error: true
        timeout-minutes: 10
        run: |
          node scripts/fetch-addresses.js --out /tmp/ext-raw
          node scripts/build-addresses.js /tmp/ext-raw data/snapshot.json data/address-points.json

      # The review gate (scripts/data-check.js): the tests on this week's data, and this week against
      # last week. A failing test, or a measure that moved more than usual, holds the update.
      - name: Check this week's data
        id: check
        env:
          SITE_CHECKS: warn
          SITE_CHECKS_REPORT: /tmp/site-checks.jsonl
          ACCEPT: ${{ inputs.accept_data }}
        run: |
          mkdir -p /tmp/prev
          git show HEAD:data/snapshot.json > /tmp/prev/snapshot.json
          git show HEAD:data/tree-counts.json > /tmp/prev/tree-counts.json || true
          : > "$SITE_CHECKS_REPORT"
          if npm test > /tmp/test.log 2>&1; then failed=0; else failed="$(grep -c '^not ok' /tmp/test.log || true)"; [ "${failed:-0}" -gt 0 ] || failed=1; fi
          accept=""; [ "$ACCEPT" = "true" ] && accept="--accept"
          node scripts/data-check.js --prev /tmp/prev --data data --site-report "$SITE_CHECKS_REPORT" --tests-failed "${failed:-0}" --test-log /tmp/test.log $accept --out /tmp/check.json --md /tmp/check.md
          cat /tmp/check.md >> "$GITHUB_STEP_SUMMARY"
          echo "held=$(node -e "process.stdout.write(require('/tmp/check.json').held ? 'true' : 'false')")" >> "$GITHUB_OUTPUT"

      # Held: last week's data stays, the app says so (data/refresh.json), and one open review issue
      # (label data-held) gets the table: a new one, or a comment on the one still open.
      - name: Hold this week's data for review
        if: steps.check.outputs.held == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -- data/
          gh label create data-held --color FBCA04 --description "Weekly data update held for review" --force
          url="$(gh issue list --label data-held --state open --json url --jq '.[0].url')"
          if [ -n "$url" ]; then gh issue comment "$url" --body-file /tmp/check.md; else url="$(gh issue create --title "Weekly data update held for review ($(date -u +%Y-%m-%d))" --body-file /tmp/check.md --label data-held)"; fi
          node scripts/data-check.js --refresh-json data/refresh.json --check /tmp/check.json --issue "$url"
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/refresh.json
          git diff --cached --quiet || { git commit -m "Weekly data update held for review $(date -u +%Y-%m-%d)"; bash scripts/push-data.sh; }
          echo "::warning::This week's data update is held for review: $url"

      - name: Commit if changed
        if: steps.check.outputs.held != 'true'
        run: |
          node scripts/data-check.js --refresh-json data/refresh.json --check /tmp/check.json
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json data/history.json data/areas.json data/das.json data/das-2016.json data/council.json data/council-decisions.json data/fsr.json data/tree-counts.json data/capital.json data/capital-links-audit.json data/eas.json data/eas-review.csv data/address-points.json data/refresh.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Weekly data snapshot $(date -u +%Y-%m-%d)"
            bash scripts/push-data.sh
          fi

  deploy:
    needs: snapshot
    # Deploy even if the snapshot was skipped (push) or failed (the site still works live);
    # only main is deployed.
    if: always() && needs.snapshot.result != 'cancelled' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch tip, so a snapshot committed by the job above is included.
          ref: ${{ github.ref_name }}
          # Full history for the change log.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A broken build never goes live: the unit tests, and every script index.html loads
      # checked for names that aren't defined in their module (eslint.config.mjs). Tests pinned to one
      # real site follow the data and are reported, not fatal (the weekly check reviews them).
      - name: Unit tests
        env:
          SITE_CHECKS: warn
        run: npm test

      - name: Script check (undefined names)
        run: npm run lint

      # The change log (Change log tab): one release per merged pull request, from the history.
      - name: Change log
        continue-on-error: true
        run: node scripts/build-changelog.js --out data/changelog.json

      # Evidence of no double counting, in the run's summary page. A failed
      # integrity check marks the step red but does not block the deploy.
      - name: Duplicate audit
        continue-on-error: true
        run: node scripts/audit-snapshot.js data/snapshot.json

      - name: Stamp version (cache-busting for scripts and styles)
        run: |
          v="$(git rev-parse --short HEAD)"
          sed -i "s/__BUILD__/${v}/g" index.html sw.js
          grep -c "?v=${v}" index.html

      - uses: actions/configure-pages@v5

      # One artifact name per attempt, so re-running a failed deploy doesn't find several
      # "github-pages" artifacts and refuse.
      # The public build: the app files only (PUBLIC_BUILD). Scripts, tests, docs and anything
      # internal (the manhole data check, reports-internal/) are never published; the build fails
      # if any of it slips into the site.
      - name: Public build (app files only)
        env:
          PUBLIC_BUILD: '1'
        run: |
          rm -rf _site && mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js data icons _site/
          if find _site -path '*internal*' | grep -q . ; then echo "internal files in the public build:"; find _site -path '*internal*'; exit 1; fi
          if grep -rl "reports-internal\|manhole-check.csv" _site/js _site/index.html >/dev/null; then echo "public code refers to the internal check"; exit 1; fi
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
