name: Probe data sources

# Diagnostic only. Run manually from the Actions tab.
#  mode=all:    list what each municipality publishes + dry-run the snapshot (not committed)
#  mode=phases: report how multi-phase developments appear in the data
#  mode=imagery: aerial imagery / building footprints covering Peel, dates and CORS
#  mode=aerial:  run the app in headless Chromium and test the aerial check on live imagery
#  mode=areas:   secondary plan, MTSA, 2021 census and SGU layers covering Peel
#  mode=block-areas: block plan / precinct / sub-area layers published by Brampton, Caledon, Mississauga and Peel (log only)
#  mode=precincts: add Brampton's precinct plan areas to data/areas.json (committed to this branch; nothing else rebuilt)
#  mode=census:  earlier census (2016) population by dissemination area
#  mode=servicing: Peel water pressure zones and wastewater drainage areas
#  mode=servicing-raw: download Peel water / wastewater layers to the servicing-raw branch
#  mode=peel-reports: download Peel wastewater annual reports and water quality reports to the peel-reports branch
#  mode=refs-council: download reference documents and probe council meeting portals (pushed to the ref-docs branch)
#  mode=masterplan: download the 2020 Water and Wastewater Master Plan volumes as text (pushed to the ref-docs-mp branch)
#  mode=dc-maps: download the 2026 DC capital maps (water, wastewater) as text, images, SVG and any GeoPDF layers (ref-docs-dc branch)
#  mode=linework: existing watermains, sanitary mains, storm sewers and ponds published for Peel (log only)
#  mode=linework-raw: download existing water / wastewater linework, report field completeness (linework-raw branch)
#  mode=sewer-build: rebuild data/sewers.json (sewer pipe capacity screen), data/water-supply.json (large mains across zone boundaries) and data/watermains.json (300 mm+ network for the water trace) from the Region's mains, committed to this branch
#  mode=dragonfly: the Region's I&I story map, its web maps and the 40 wastewater Blocks (Dragonfly, WEFTEC 2024), pushed to the dragonfly-raw branch
#  mode=fsr: latest functional servicing reports on the application pages (data/fsr.json, committed to this branch)
#  mode=external: housing supply progress, MoF projections, compliance reports, CMHC tables (StatCan), IDF files (ext-raw branch)
#  mode=constraints: gas pipelines, hydro lines, watercourses and conservation authority regulation limits covering Peel (log only)
#  mode=peel-open: Region of Peel housing construction activity and building permit statistics (data/peel-housing.json, committed to this branch); scripts/probe-peel-open.js lists the Region's other layers
#  mode=tree-audit: how applications nest into developments — a live pull of every source, then scripts/audit-tree.js (data/tree-audit.json, committed to this branch; report only)
#  mode=servicing-build: rebuild data/servicing.json (pressure zones, traced drainage areas), committed to this branch
#  mode=capital: Region capital projects layer → capital.json + DC match audit, built in the runner and summarised in the log (no personnel fields); only=commit also commits data/capital.json and data/capital-links-audit.json to this branch (hold until Peel GIS confirms the layer may be published)
#  mode=capital-probe: the capital service's other layers and the line layer's text fields / project websites (counts and facility names only; log only)
#  mode=ea-maps: download every EA page's study-area maps (images, study-area figures; PDFs as PNG) to the ea-maps branch, for tracing
#  mode=ea-trace: trace the EA study areas listed in scripts/ea-trace.json from the ea-maps images (intersections geocoded); data/eas-overrides.json committed to this branch
#  mode=eas: Region EA list + project pages → data/eas.json and data/eas-review.csv, committed to this branch; only=with-capital also links EAs to capital records
#  mode=constraints-build: the approved constraint layers → data/constraints/<id>/ tiles, manifest.json and the 25 m screening grid (grid.json), committed to this branch; only=<id,id> rebuilds some
#  mode=elev-bench: the lidar sampler against Brampton benchmarks (height above grade, CGVD28 → CGVD2013 with NRCan grids) and where coverage ends (data/probe/elevation-bench.json)
#  mode=elev-check: the lidar elevation sampler's service checks and the benchmark comparison (data/probe/elevation.json, committed to this branch)
#  mode=elev-validate: ground elevation (lidar, terrain tiles) against Peel sanitary manholes in the validation areas: data/elevation-validation.json and tests/fixtures/manhole-sample.json committed to this branch; the internal data check (manholes > 5 m off, with FacilityID) as an artifact only, never committed
#  mode=tiles-3d: the 3D view's pilot tiles (North Brampton): lidar terrain and OSM buildings as PMTiles in data/3d/, committed to this branch
#  mode=constraints-lidar: Stage 0 source check for lidar elevation and the constraint layers (endpoint, coverage, resolution, dates, licence, CORS); data/probe/constraints-lidar.json committed to this branch, report only
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'all, fsr, external, phases, imagery, aerial, areas, census, servicing, servicing-raw, servicing-build, peel-reports, refs-council, masterplan, dc-maps, linework, linework-raw, sewer-build, capital, capital-probe, ea-maps, ea-trace or eas'
        default: 'all'
        required: false
      only:
        description: 'mode=external: one part only (mto, cmhc); mode=capital: commit; mode=eas: with-capital; mode=tiles-3d: terrain or buildings'
        default: ''
        required: false

permissions:
  contents: write   # mode=areas commits data/areas.json and data/das.json to the branch it runs on

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Build areas and census baseline (committed to this branch)
        if: inputs.mode == 'areas'
        run: |
          node scripts/build-areas.js --out data
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/areas.json data/das*.json
          git diff --cached --quiet || { git commit -m "Areas and census baselines (2021, 2016)"; git push; }
      - name: Lidar elevation sampler checks and benchmarks (data/probe/elevation.json committed to this branch)
        if: inputs.mode == 'elev-check'
        run: |
          node scripts/probe-elevation.js
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe/elevation.json
          git diff --cached --quiet || { git commit -m "Elevation checks: lidar sampler, hillshade, benchmarks"; git pull --rebase origin "${GITHUB_REF_NAME}"; git push; }
      - name: Constraint layers (data/constraints committed to this branch)
        if: inputs.mode == 'constraints-build'
        run: |
          if [ -n "${{ inputs.only }}" ]; then node scripts/build-constraints.js --only "${{ inputs.only }}"; else node scripts/build-constraints.js; fi
          du -sh data/constraints; du -s data/constraints/* | sort -n | tail -20
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/constraints
          git diff --cached --quiet || { git commit -m "Constraint layers: tiles, manifest and screening grid"; git pull --rebase origin "${GITHUB_REF_NAME}"; git push; }
      - name: Lidar sampler against benchmarks (data/probe/elevation-bench.json committed to this branch)
        if: inputs.mode == 'elev-bench'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq proj-bin >/dev/null
          node scripts/probe-elev-bench.js
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe/elevation-bench.json
          git diff --cached --quiet || { git commit -m "Elevation benchmarks: lidar vs Brampton benchmarks (CGVD2013)"; git pull --rebase origin "${GITHUB_REF_NAME}"; git push; }
      - name: Elevation against Peel manholes (table and fixture committed to this branch; internal check as an artifact)
        if: inputs.mode == 'elev-validate'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq proj-bin >/dev/null
          node scripts/probe-elev-validate.js
          node --test tests/elevation-validation.test.js
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/elevation-validation.json tests/fixtures/manhole-sample.json
          git diff --cached --quiet || { git commit -m "Elevation validation: lidar and terrain tiles against Peel manholes"; git pull --rebase origin "${GITHUB_REF_NAME}"; git push; }
      - name: Internal data check (artifact only, not published)
        if: inputs.mode == 'elev-validate'
        uses: actions/upload-artifact@v4
        with:
          name: internal-manhole-check
          path: reports-internal/
          retention-days: 30
      - name: 3D view pilot tiles (lidar terrain + OSM buildings, committed to this branch)
        if: inputs.mode == 'tiles-3d'
        timeout-minutes: 30
        run: |
          npm install --no-save --silent geojson-vt@4.0.2 vt-pbf@3.1.3
          node scripts/build-3d-tiles.js ${{ inputs.only != '' && format('--only={0}', inputs.only) || '' }}
          node --test tests/tiles-3d.test.js
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/3d/
          git diff --cached --quiet || { git commit -m "3D view: pilot lidar terrain and OSM building tiles"; git pull --rebase origin "${GITHUB_REF_NAME}"; git push; }
      - name: Lidar elevation and constraint layers, source check (report only; summary committed to this branch)
        if: inputs.mode == 'constraints-lidar'
        run: |
          node scripts/probe-constraints-lidar.js --out data/probe/constraints-lidar.json
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe/constraints-lidar.json
          git diff --cached --quiet || { git commit -m "Stage 0 source check: lidar elevation and constraint layers (report only)"; git pull --rebase origin "${GITHUB_REF_NAME}"; git push; }
      - name: Block plan / precinct area layers (log only)
        if: inputs.mode == 'block-areas'
        run: node scripts/probe-areas.js --blocks
      - name: Precinct plan areas into data/areas.json (committed to this branch; nothing else rebuilt)
        if: inputs.mode == 'precincts'
        run: |
          node scripts/build-areas.js --out data --precincts-only
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/areas.json
          git diff --cached --quiet || { git commit -m "Precinct plan areas (Brampton Plan Schedule 11)"; git pull --rebase origin "${GITHUB_REF_NAME}"; git push; }
      - name: Earlier census by dissemination area
        if: inputs.mode == 'census'
        run: |
          node scripts/probe-census.js
      - name: Existing water / wastewater / storm linework (log only)
        if: inputs.mode == 'linework'
        run: node scripts/probe-linework.js
      - name: Existing linework download and completeness (pushed to the linework-raw branch)
        if: inputs.mode == 'linework-raw'
        run: |
          node scripts/fetch-linework-raw.js --out linework-raw
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B linework-raw
          git add -f linework-raw
          git commit -m "Existing water / wastewater linework (raw)"
          git push -f origin linework-raw
      - name: Rebuild the sewer pipe capacity data (committed to this branch)
        if: inputs.mode == 'sewer-build'
        run: |
          node scripts/fetch-linework-raw.js --out /tmp/linework-raw
          node scripts/build-sewer-capacity.js --raw /tmp/linework-raw --out data
          node scripts/build-water-supply.js --raw /tmp/linework-raw --out data
          node scripts/build-watermains.js --raw /tmp/linework-raw --out data
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sewers.json data/water-supply.json data/watermains.json
          git diff --cached --quiet || { git commit -m "Sewer pipe capacity and water supply data"; git push; }
      - name: Dragonfly / Peel I&I blocks (pushed to the dragonfly-raw branch)
        if: inputs.mode == 'dragonfly'
        run: |
          node scripts/probe-dragonfly.js --out dragonfly-raw
          du -sh dragonfly-raw; ls -la dragonfly-raw | head -100
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B dragonfly-raw
          git add -f dragonfly-raw
          git commit -m "Dragonfly / Peel I&I blocks (raw)"
          git push -f origin dragonfly-raw
      - name: Functional servicing reports (committed to this branch)
        if: inputs.mode == 'fsr'
        run: |
          node scripts/build-fsr.js --out data
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fsr.json
          git diff --cached --quiet || { git commit -m "Functional servicing report links"; git push; }
      - name: External open data (pushed to the ext-raw branch)
        if: inputs.mode == 'external'
        run: |
          git fetch origin ext-raw && git checkout origin/ext-raw -- ext-raw || true
          if [ -n "${{ inputs.only }}" ]; then node scripts/fetch-external.js --out ext-raw --only ${{ inputs.only }}; else node scripts/fetch-external.js --out ext-raw; fi
          du -sh ext-raw; find ext-raw -type f | head -200
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ext-raw
          git add -f ext-raw
          git commit -m "External open data (raw)"
          git push -f origin ext-raw
      - name: Site constraint layers (gas, hydro, watercourses, regulation limits; log only)
        if: inputs.mode == 'constraints'
        timeout-minutes: 20
        run: node scripts/probe-constraints.js ${{ inputs.only }}
      - name: Region of Peel open data (log; housing activity and permits committed to this branch)
        if: inputs.mode == 'peel-open'
        timeout-minutes: 30
        run: |
          node scripts/build-peel-housing.js --out data
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/peel-housing.json
          git diff --cached --quiet || { git commit -m "Region of Peel housing activity and building permits"; git push; }
      - name: Application tree audit (report only; data/tree-audit.json committed to this branch)
        if: inputs.mode == 'tree-audit'
        timeout-minutes: 40
        run: |
          node scripts/audit-tree.js --live
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tree-audit.json
          git diff --cached --quiet || { git commit -m "Application tree audit (live pull)"; git pull --rebase origin "${GITHUB_REF_NAME}"; git push; }
      - name: Water pressure zones and wastewater drainage areas
        if: inputs.mode == 'servicing'
        run: node scripts/probe-servicing.js
      - name: Download water / wastewater layers (pushed to the servicing-raw branch)
        if: inputs.mode == 'servicing-raw'
        run: |
          node scripts/fetch-servicing-raw.js --out data-raw
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B servicing-raw
          git add -f data-raw
          git commit -m "Raw Peel water / wastewater layers"
          git push -f origin servicing-raw
      - name: Download Peel wastewater / water quality reports (pushed to the peel-reports branch)
        if: inputs.mode == 'peel-reports'
        run: |
          node scripts/fetch-peel-reports.js --out peel-reports
          du -sh peel-reports; ls -la peel-reports | head -200
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B peel-reports
          git add -f peel-reports
          git commit -m "Peel wastewater annual reports and water quality reports"
          git push -f origin peel-reports
      - name: Reference documents and council meeting probe (pushed to the ref-docs branch)
        if: inputs.mode == 'refs-council'
        run: |
          node scripts/fetch-docs.js --out ref-docs
          node scripts/probe-council.js --out ref-docs/council
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ref-docs
          git add -f ref-docs
          git commit -m "Reference documents and council probe"
          git push -f origin ref-docs
      - name: Master plan volumes as text (pushed to the ref-docs-mp branch)
        if: inputs.mode == 'masterplan'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          mkdir -p mp
          for v in 1 2 3 4; do
            curl -sSL -A "Mozilla/5.0 (peel-dev-tracker)" -o mp/vol$v.pdf "https://peelregion.ca/sites/default/files/2024-07/ea-peel-2020-master-plan-volume-$v.pdf" || true
            pdfinfo mp/vol$v.pdf | grep -E "Pages|Title" || true
            pdftotext -layout mp/vol$v.pdf mp/vol$v.txt && gzip -9 mp/vol$v.txt
            rm -f mp/vol$v.pdf
          done
          ls -la mp
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ref-docs-mp
          git add -f mp
          git commit -m "2020 Master Plan volumes as text"
          git push -f origin ref-docs-mp
      - name: DC capital maps (pushed to the ref-docs-dc branch)
        if: inputs.mode == 'dc-maps'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils gdal-bin >/dev/null
          mkdir -p dc
          for k in wastewater water; do
            curl -sSL -A "Mozilla/5.0 (peel-dev-tracker)" -o dc/$k.pdf "https://peelregion.ca/sites/default/files/2026-03/capital-map-$k-development-charges-v2.pdf" || true
            ls -la dc/$k.pdf; pdfinfo dc/$k.pdf > dc/$k.info.txt 2>&1 || true; cat dc/$k.info.txt
            pdftotext -layout dc/$k.pdf dc/$k.txt || true
            pdftotext -bbox-layout dc/$k.pdf dc/$k.bbox.html || true
            pdftoppm -r 40 -png dc/$k.pdf dc/$k-small || true
            pdftoppm -r 110 -png dc/$k.pdf dc/$k-med || true
            pdftocairo -svg dc/$k.pdf dc/$k.svg || true
            gdalinfo dc/$k.pdf > dc/$k.gdalinfo.txt 2>&1 || true; head -60 dc/$k.gdalinfo.txt
            ogrinfo -ro -so dc/$k.pdf > dc/$k.ogrinfo.txt 2>&1 || true; head -80 dc/$k.ogrinfo.txt
            mkdir -p dc/$k-layers
            ogr2ogr -f GeoJSON -t_srs EPSG:4326 dc/$k-layers/all.geojson dc/$k.pdf 2>/dev/null || true
            for L in $(ogrinfo -ro -q dc/$k.pdf 2>/dev/null | sed -n 's/^[0-9]*: \(.*\) (.*/\1/p' | tr ' ' '%'); do
              n=$(echo "$L" | tr '%' ' '); f=$(echo "$L" | tr -c 'A-Za-z0-9\n' '_')
              ogr2ogr -f GeoJSON -t_srs EPSG:4326 "dc/$k-layers/$f.geojson" dc/$k.pdf "$n" 2>/dev/null || true
            done
            gzip -9 -f dc/$k.svg dc/$k.bbox.html || true
            rm -f dc/$k.pdf
          done
          for d in "dcbs2024 https://peelregion.ca/sites/default/files/2024-05/peel_development-charges-background-study.pdf" "dcbs2024may https://peelregion.ca/sites/default/files/2024-05/peel-dc-background-study-may-13.pdf"; do
            set -- $d; curl -sSL -A "Mozilla/5.0 (peel-dev-tracker)" -o dc/$1.pdf "$2" || true
            pdfinfo dc/$1.pdf | grep -E "Pages|Title" || true
            pdftotext -layout dc/$1.pdf dc/$1.txt || true; gzip -9 -f dc/$1.txt || true; rm -f dc/$1.pdf
          done
          for d in "news-link2build https://www.link2build.ca/news/posts/peel-region-allocates-130-million-to-expand-wastewater-capacity/" "news-ocn https://ontarioconstructionnews.com/peel-region-pours-130-million-into-expansion-plan-at-water-treatment-plant" "dc-page https://peelregion.ca/about/finance/development-charges"; do
            set -- $d; curl -sSL -A "Mozilla/5.0 (peel-dev-tracker)" -o dc/$1.html "$2" || true
          done
          du -sh dc; ls -laR dc | head -120
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ref-docs-dc
          git add -f dc
          git commit -m "2026 DC capital maps"
          git push -f origin ref-docs-dc
      - name: Capital projects and DC match (log; committed only with only=commit)
        if: inputs.mode == 'capital'
        timeout-minutes: 20
        run: |
          node scripts/build-capital.js --out /tmp/capital
          if [ "${{ inputs.only }}" = "commit" ]; then
            cp /tmp/capital/capital.json /tmp/capital/capital-links-audit.json data/
            npm test > /tmp/test.log 2>&1 || { tail -80 /tmp/test.log; exit 1; }
            git config user.name "peel-snapshot-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/capital.json data/capital-links-audit.json
            git diff --cached --quiet || { git commit -m "Capital projects and DC match audit"; git pull --rebase origin "${GITHUB_REF_NAME}"; git push; }
          fi
      - name: Capital service layers and text fields (log only)
        if: inputs.mode == 'capital-probe'
        timeout-minutes: 15
        run: node scripts/probe-capital.js
      - name: EA study-area maps (pushed to the ea-maps branch)
        if: inputs.mode == 'ea-maps'
        timeout-minutes: 40
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils imagemagick >/dev/null
          node scripts/fetch-ea-maps.js --out ea-maps
          for f in $(find ea-maps -name '*.pdf'); do
            pdftoppm -r 110 -png -f 1 -l 2 "$f" "${f%.pdf}-p" || true
            rm -f "$f"
          done
          for f in $(find ea-maps -name '*.webp' -o -name '*.jpg' -o -name '*.png'); do convert "$f" -resize '2200x2200>' "$f" 2>/dev/null || true; done
          du -sh ea-maps; find ea-maps -type f | wc -l
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # An orphan branch with the maps only (no workflow files, which the Actions token may not push).
          git checkout --orphan ea-maps
          git rm -rq --cached . && git add -f ea-maps
          git commit -qm "EA study-area maps (raw, for tracing)"
          git push -f origin ea-maps
      - name: Trace EA study areas (data/eas-overrides.json committed to this branch)
        if: inputs.mode == 'ea-trace'
        timeout-minutes: 55
        run: |
          pip install -q pillow numpy
          git fetch -q origin ea-maps && git checkout origin/ea-maps -- ea-maps
          # Streets and city boundaries from OpenStreetMap (the Ontario extract cut to Peel): every
          # segment of each street, so the crossings are found locally.
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool >/dev/null
          curl -sSfL -o /tmp/on.pbf https://download.geofabrik.de/north-america/canada/ontario-latest.osm.pbf
          osmium extract -s smart -b -80.35,43.40,-79.40,44.10 /tmp/on.pbf -o /tmp/peel.pbf --overwrite
          osmium tags-filter /tmp/peel.pbf w/highway -o /tmp/peel-roads.pbf --overwrite
          osmium export /tmp/peel-roads.pbf -f geojsonseq --geometry-types=linestring -o /tmp/peel-roads.geojsonseq --overwrite
          osmium tags-filter /tmp/peel.pbf r/boundary=administrative -o /tmp/peel-admin.pbf --overwrite
          osmium export /tmp/peel-admin.pbf -f geojsonseq --geometry-types=polygon -o /tmp/peel-munis.geojsonseq --overwrite
          ls -la /tmp/peel-roads.geojsonseq /tmp/peel-munis.geojsonseq
          EA_ROADS=/tmp/peel-roads.geojsonseq EA_MUNIS=/tmp/peel-munis.geojsonseq python3 scripts/ea_trace.py
          git reset -q ea-maps && rm -rf ea-maps
          # Rebuild the EA list so the traced areas drive the DC / facility links too.
          node scripts/build-eas.js --out data --capital /nonexistent > /tmp/eas.log 2>&1 || { tail -40 /tmp/eas.log; exit 1; }
          grep -E '^EAs:|geomType|geomConfidence|linked to' /tmp/eas.log || true
          npm test > /tmp/test.log 2>&1 || { tail -80 /tmp/test.log; exit 1; }
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eas-overrides.json scripts/ea-xings.json data/eas.json data/eas-review.csv
          git diff --cached --quiet || { git commit -m "EA study areas traced from the project page maps"; git pull --rebase origin "${GITHUB_REF_NAME}"; git push; }
      - name: Environmental assessments (committed to this branch)
        if: inputs.mode == 'eas'
        timeout-minutes: 40
        run: |
          if [ "${{ inputs.only }}" = "with-capital" ]; then
            node scripts/build-capital.js --out /tmp/capital > /tmp/capital.log
            node scripts/build-eas.js --out data --capital /tmp/capital/capital.json
          else
            node scripts/build-eas.js --out data --capital /nonexistent
          fi
          npm test > /tmp/test.log 2>&1 || { tail -80 /tmp/test.log; exit 1; }
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eas.json data/eas-review.csv
          git diff --cached --quiet || { git commit -m "Environmental assessments (list, project pages, geometry)"; git pull --rebase origin "${GITHUB_REF_NAME}"; git push; }
      - name: Rebuild pressure zones and drainage areas (committed to this branch)
        if: inputs.mode == 'servicing-build'
        run: |
          node scripts/build-servicing.js --out data
          node scripts/build-svc-census.js
          git config user.name "peel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/servicing.json data/svc-census.json
          git diff --cached --quiet || { git commit -m "Pressure zones and drainage areas"; git push; }
      - name: Imagery and footprints
        if: inputs.mode == 'imagery'
        run: node scripts/probe-imagery.js targeted
      - name: Aerial check end-to-end
        if: inputs.mode == 'aerial'
        timeout-minutes: 15
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          (python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          APP=http://localhost:8000/ OUT=/tmp/aerial node scripts/aerial-e2e.js
      - name: Upload aerial screenshots
        if: inputs.mode == 'aerial' && always()
        uses: actions/upload-artifact@v4
        with:
          name: aerial-check
          path: /tmp/aerial
      - name: List what each municipality publishes
        if: inputs.mode == 'all' || inputs.mode == ''
        run: node scripts/probe-sources.js
      - name: Multi-phase developments
        if: inputs.mode == 'phases'
        run: node scripts/phase-probe.js
      - name: Dry-run snapshot (not committed)
        if: inputs.mode == 'all' || inputs.mode == ''
        run: |
          node scripts/build-snapshot.js --out /tmp/data
          node scripts/snapshot-summary.js /tmp/data/snapshot.json
