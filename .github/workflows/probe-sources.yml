name: Probe data sources

# Diagnostic only: lists the datasets each municipality publishes and dry-runs the
# weekly snapshot without committing. Run manually from the Actions tab.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: List what each municipality publishes
        run: node scripts/probe-sources.js
      - name: Dry-run snapshot (not committed)
        run: |
          node scripts/build-snapshot.js --out /tmp/data
          node scripts/snapshot-summary.js /tmp/data/snapshot.json
